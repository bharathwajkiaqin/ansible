---
- name: Install and Configure Jenkins via Docker
  hosts: all
  become: true
  tasks:
    - name: Remove broken jenkins apt repo if present
      shell: rm -f /etc/apt/sources.list.d/*jenkins*

    - name: Run Jenkins container
      shell: |
        docker rm -f jenkins || true
        docker run -d --name jenkins --restart=always \
          -p 8080:8080 -p 50000:50000 \
          -v jenkins_home:/var/jenkins_home \
          jenkins/jenkins:lts
