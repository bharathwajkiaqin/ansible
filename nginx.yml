---
- name: Install and Configure Nginx
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configure custom welcome page
      copy:
        dest: /var/www/html/index.html
        content: "<h1>Nginx is running via Ansible!</h1>\n"

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
